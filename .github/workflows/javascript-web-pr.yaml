name: JavaScript Web PR Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'javascript/web/**'
      - '.github/workflows/javascript-web-pr.yaml'

# Cancel any jobs in-progress for the current branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: javascript/web

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-dependencies.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: javascript/web/package-lock.json
      - name: Cache Node Modules
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: |
            javascript/web/node_modules
          key: ${{ runner.os }}-javascript-web-node_modules-${{ hashFiles('javascript/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-javascript-web-node_modules-
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore node_modules
        id: cache-node_modules
        uses: actions/cache@v4
        with:
          path: |
            javascript/web/node_modules
          key: ${{ runner.os }}-javascript-web-node_modules-${{ hashFiles('javascript/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-javascript-web-node_modules-
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore node_modules
        id: cache-node_modules
        uses: actions/cache@v4
        with:
          path: |
            javascript/web/node_modules
          key: ${{ runner.os }}-javascript-web-node_modules-${{ hashFiles('javascript/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-javascript-web-node_modules-
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
