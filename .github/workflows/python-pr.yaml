name: Python PR Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python-pr.yaml'

# Cancel any jobs in-progress for the current branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/poetry.lock
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: '2.5.1'
      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Cache virtual environment
        uses: actions/cache@v6
        with:
          path: python/.venv
          key: venv-${{ runner.os }}-python-${{ hashFiles('python/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Lint
        run: poetry run ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/poetry.lock
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: '2.5.1'
      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Cache virtual environment
        uses: actions/cache@v6
        with:
          path: python/.venv
          key: venv-${{ runner.os }}-python-${{ hashFiles('python/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Test
        run: poetry run pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/poetry.lock
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: '2.5.1'
      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Cache virtual environment
        uses: actions/cache@v6
        with:
          path: python/.venv
          key: venv-${{ runner.os }}-python-${{ hashFiles('python/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Build
        run: poetry build
