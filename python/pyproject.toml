[tool.poetry]
name = "hyphen-openfeature-provider"
version = "1.1.1"
description = "Hyphen provider for OpenFeature Python SDK"
authors = ["Hyphen AI"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/Hyphen/open-feature"
documentation = "https://github.com/Hyphen/open-feature/tree/main/python"
packages = [
    { include = "openfeature_provider_hyphen", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.8"
openfeature-sdk = "0.7.4"
requests = "^2.31.0"
cachetools = "^5.3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.1"
requests-mock = "^1.12.1"
isort = "^5.13.2"
ruff = "^0.17.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
# Ruff 0.9's default rules. Ruff 0.17's wider default includes rewrites
# that need Python 3.10, above this package's 3.8 floor.
select = ["E4", "E7", "E9", "F"]
